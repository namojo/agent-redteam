name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # no npm ci: zero runtime dependencies
      - run: npm test
      - run: node src/cli.mjs --help
      - run: npm run demo
      - run: node src/cli.mjs run --mock secure --quiet
      - name: mock vulnerable must fail the gate (exit 1)
        shell: bash
        run: |
          set +e
          node src/cli.mjs run --mock vulnerable --quiet
          code=$?
          test "$code" -eq 1
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node .claude/skills/redteam-qa/scripts/hygiene.mjs

  # same build as pages.yml, so a broken site build or Mermaid lint fails CI before it reaches main's Pages deploy
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site build dependencies (devDependencies only; the tool itself has none)
        run: npm ci --prefix site
      - name: Build site
        run: node site/build.mjs
