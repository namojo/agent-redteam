name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege: the workflow only reads the repo; Pages write + OIDC are granted to the deploy job alone
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read      # actions/configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # the console ships src/core as-is: a red engine must never be deployed.
      # root package.json has zero dependencies, so no install is needed for the tests.
      - name: Engine tests
        run: npm test

      - name: Install site build dependencies
        run: npm ci --prefix site

      - name: Build site
        run: node site/build.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
